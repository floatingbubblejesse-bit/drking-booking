.session-btn b{font-weight:650;font-size:13px;overflow-wrap:anywhere}
.session-btn small{color:#5b7d73;font-size:11px;font-variant-numeric:tabular-nums}
.session-btn:hover{border-color:#94c6bd;background:#f1f9f6}
.session-btn.mine{border-color:#0f6a6e;background:#e8f5f2;box-shadow:0 0 0 1px #0f6a6e}
.session-btn.full{opacity:.45}
.week-empty{color:#c3d2cc;text-align:center;font-size:12px}
@media(max-width:350px){.week-head{font-size:14px}.week-period{font-size:13px}}
@media(max-width:639px){.week-row{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:5px}.week-row.empty{display:none}.session-btn{padding:7px 3px;min-height:50px}}
@media(max-width:350px){.week-row{grid-template-columns:40px repeat(3,minmax(0,1fr));gap:4px;padding:5px}.session-btn{padding:6px 2px}.session-btn b{font-size:12px}.session-btn small{font-size:10px}}

/* v18：醫師左右滑輪播卡片 */
.doctor-carousel{position:relative}
.carousel-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel-track::-webkit-scrollbar{display:none}
.carousel-page{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;scroll-snap-align:start;scroll-snap-stop:always;padding:3px 3px 6px}
.dcard{display:flex;flex-direction:column;gap:9px;padding:12px;border:1.5px solid var(--line);border-radius:15px;background:#fff;min-width:0;transition:border-color .18s,box-shadow .18s}
.dcard.selected{border-color:#0f6a6e;box-shadow:0 0 0 1px #0f6a6e;background:#f6fbf9}/* 2026-09-19 點選框線加深加粗（照片勾勾已移除，改以框線標示） */
.dcard .photo-frame{aspect-ratio:1/1;border-radius:12px}
.dcard-name{font-size:15px;font-weight:650;text-align:center;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.dcard-btn{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;line-height:1.3;padding:8px 6px;width:100%}
.dcard-btn:disabled{opacity:.4;cursor:default}
.dcard-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.dcard-btn.primary.on{background:var(--deep);border-color:var(--deep)}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fffffff2;color:var(--teal);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 8px #183e4014;padding:0}
.carousel-arrow:disabled{opacity:.3}
.carousel-arrow[hidden]{display:none}
#doctor-prev{left:-8px}#doctor-next{right:-8px}
.carousel-dots{display:flex;justify-content:center;gap:4px;margin-top:10px;flex-wrap:wrap}
.carousel-dots:empty{display:none}
.dot{min-width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:#86998f;font-size:13px;padding:0 6px}
.dot.on{border-color:var(--teal);color:var(--teal);font-weight:700;background:#f1f9f6}
.carousel-empty{grid-column:1/-1}
@media(min-width:640px){.carousel-page{grid-template-columns:repeat(4,minmax(0,1fr))}#doctor-prev{left:-14px}#doctor-next{right:-14px}}

/* v19：醫師卡（照片打勾＋專長區塊）與介紹視窗 */
.dphoto{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;overflow:hidden;position:relative;text-align:left}
.dphoto .photo-frame{aspect-ratio:1/1;border-radius:12px}
.dcard.selected .selection-tick{background:var(--teal);color:#fff;border-color:var(--teal)}
.dphoto .photo-frame.frame-white{background:#e3eee9}
.dphoto .selection-tick{width:28px;height:28px;right:8px;bottom:8px;background:#ffffffeb;border:2px solid #a9d3cb;color:transparent;box-shadow:0 1px 4px #00000022}
.dcard.selected .dphoto .selection-tick{background:#5fb5ad;border-color:#fff;color:#fff;font-size:16px;box-shadow:0 0 0 2px #5fb5ad,0 1px 4px #00000022}
.dspec{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:32px;padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;background:#f7fbf9;color:var(--teal);font-size:13px;font-weight:650;letter-spacing:.08em;line-height:1.2;text-align:center}
.dspec:hover{background:var(--aqua)}
.dspec.static{background:#fff;color:#5b7d73;font-size:12px;font-weight:500;letter-spacing:0}
.date-clinic{margin-left:auto;font-size:13px;font-weight:650;letter-spacing:.02em;color:var(--teal);background:var(--aqua);border-radius:999px;padding:5px 11px;white-space:nowrap}
.profile-dialog{width:min(100% - 32px,420px)}
.profile-body{position:relative;padding-top:52px}
.profile-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;background:#fff;color:#4a6a63;display:flex;align-items:center;justify-content:center;padding:0}
.profile-arrow{position:absolute;top:150px;width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;background:#fffffff2;color:var(--teal);display:flex;align-items:center;justify-content:center;padding:0;z-index:2;box-shadow:0 2px 8px #183e4014}
.profile-arrow.prev{left:8px}.profile-arrow.next{right:8px}.profile-arrow:disabled{opacity:.3}
.profile-photo{width:min(100%,240px);aspect-ratio:1/1;margin:0 auto 14px;border-radius:14px;overflow:hidden;position:relative;background:#e3eee9}
.profile-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.profile-photo .any-doctor{height:100%}
.profile-name{text-align:center;font-size:24px;margin:0 0 6px}
.profile-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin:16px 0 6px}
.profile-h svg{color:#8aa39b;flex-shrink:0}
.profile-list{margin:0;padding-left:22px;font-size:14px;line-height:1.9;color:#3b5a55}
.profile-list li{overflow-wrap:anywhere}
.profile-note{font-size:11px;color:#93a199;margin:10px 0 0}
.profile-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;list-style:none;margin:12px 0 0;padding:0;font-size:14px;color:#3b5a55}
.profile-tags li{white-space:nowrap}
.profile-tags li::before{content:'•';color:var(--teal);margin-right:6px}
.profile-member{text-align:center;font-size:13px;color:#5b7d73;margin:8px 0 0}
.profile-body .confirm{margin-top:18px}
</style>
</head>
<body>
<div class="page">
<header class="brand-header"><button class="brand-mark brand-home" type="button" data-view="booking" aria-label="返回預約首頁"><img fetchpriority="high" decoding="async" src="image-24ae883abca41cd4.jpg" width="1000" height="311" alt="金鶯診所鳥標"></button><h1 class="brand-title"><strong>金鶯診所</strong><span>減重診預約<small id="pilot-badge" class="pilot-badge" hidden>Beta</small></span></h1><button class="header-lookup" id="header-lookup" type="button" data-view="lookup" aria-label="查詢／取消預約" title="查詢／取消預約" aria-pressed="false"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M7 2v4m8-4v4M3 9h16"/><circle cx="16.5" cy="16.5" r="3.5"/><path d="m19 19 3 3"/></svg></button></header>

abel></fieldset><p id="create-message" class="form-message" role="status"></p><button class="confirm wide" id="create-submit" type="submit">確定預約</button></form><button class="text-button wide" id="close-create" type="button">上一步</button></div></section>
</main>
