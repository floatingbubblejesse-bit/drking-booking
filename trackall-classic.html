<style>
/* Old app look: teal page, dark tiles in two columns, buttons fixed at the bottom */
:root{
  --page:#3d8389;      /* page and header */
  --band:#6aa8ad;      /* marquee band, bottom buttons */
  --tile:#2f6a70;      /* clinic tiles */
  --chip:#43898e;      /* doctor name chip */
  --ink:#ffffff;
  --sub:#1f4a4e;       /* update / date row text */
  --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:-apple-system,"Helvetica Neue",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* header: ☰, logo, 金鶯診所, departments */
.top{display:flex;align-items:center;gap:clamp(6px,2vw,10px);padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));background:var(--page)}
.menu-btn{flex:none;display:grid;place-items:center;width:34px;height:40px;margin:0;padding:0;border:0;background:none;cursor:pointer}
.menu-btn span{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--ink);box-shadow:0 -7px 0 var(--ink),0 7px 0 var(--ink)}
.logo{flex:none;display:grid;place-items:center;width:clamp(56px,17vw,70px);height:clamp(40px,12vw,48px);border-radius:50%;background:#fff;overflow:hidden}
.logo svg{display:block;height:98%;width:auto}
.brand{flex:none;font-size:clamp(26px,8.6vw,36px);font-weight:300;letter-spacing:1px;line-height:1;white-space:nowrap}
.dept{flex:1;min-width:0;display:grid;gap:3px;font-size:clamp(11px,3.4vw,14px);font-weight:600;line-height:1.15;white-space:nowrap;text-align:right}

/* marquee, one line */
.marquee{display:block;height:36px;overflow:hidden;background:var(--band);white-space:nowrap}
.marquee span{display:inline-block;padding-left:100%;line-height:36px;font-size:16px;animation:run 14s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee span{animation:none;padding-left:max(16px,env(safe-area-inset-left,0px))}}

/* update / date row */
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));color:var(--sub);font-size:15px}
.meta .mock{padding:1px 7px;border:1px solid rgba(31,74,78,.45);border-radius:999px;font-size:12px}
.near{display:flex;justify-content:center;padding:0 16px 10px}
.near button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border:1.5px solid rgba(255,255,255,.75);border-radius:999px;background:var(--tile);font-size:15px;font-weight:600;cursor:pointer}
.near button::before{content:"";width:10px;height:10px;border:2px solid currentColor;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}

/* clinic tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.clinic{display:grid;gap:8px;min-width:0}
.cname{position:relative;display:grid;place-items:center;height:64px;background:var(--tile);font-size:clamp(28px,9vw,38px);font-weight:300;letter-spacing:2px}
.cname small{position:absolute;right:6px;bottom:4px;font-family:var(--num);font-size:11px;font-weight:400;letter-spacing:0;opacity:.75}
.cbody{display:grid;justify-items:center;padding:14px 10px 14px;background:var(--tile)}
.big{font-family:var(--num);font-size:clamp(40px,13vw,52px);font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
.bar{width:58px;height:2px;margin:6px 0 8px;background:var(--ink)}
.wait{display:flex;align-items:baseline;gap:12px;font-size:18px}
.wait b{font-family:var(--num);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums}
.docs{justify-self:stretch;display:grid;gap:6px;margin-top:12px}
.doc{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.doc span{min-width:0;padding:3px 7px;background:var(--chip);font-size:clamp(14px,4.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:clip}
.doc b{flex:none;font-family:var(--num);font-size:clamp(18px,5.6vw,22px);font-weight:500;font-variant-numeric:tabular-nums}

/* bottom buttons, fixed */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--page)}
.bottom a{display:grid;place-items:center;height:72px;background:var(--band);font-size:clamp(28px,9vw,40px);font-weight:700;letter-spacing:2px}

/* side menu */
.drawer{position:fixed;inset:0;z-index:10;display:flex;background:rgba(10,30,32,.45)}
.drawer nav{display:grid;align-content:start;gap:2px;width:min(78vw,300px);height:100%;padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px max(0px,env(safe-area-inset-left,0px));background:var(--tile);box-shadow:4px 0 16px rgba(0,0,0,.25)}
.drawer nav b{padding:6px 22px 14px;font-size:22px;font-weight:300}
.drawer nav a{padding:14px 22px;font-size:18px;border-top:1px solid rgba(255,255,255,.12)}
.drawer nav a[aria-current]{background:var(--chip)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>

function render(){

    s.docs.forEach(function(d){var r=el('div','doc');r.appendChild(el('span','',d.name));r.appendChild(el('b','',String(d.num)));docs.appendChild(r)});
    body.appendChild(docs);
    a.appendChild(head);a.appendChild(body);frag.appendChild(a);
  });
  grid.replaceChildren(frag);
}

/* date, countdown */
var WD=['日','一','二','三','四','五','六'];
function today(){var d=new Date();document.getElementById('today').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WD[d.getDay()]}
var left=10,cd=document.getElementById('countdown');
function tick(){
  left--;
  if(left<=0){
    left=10;today();
    state.forEach(function(s){s.docs.forEach(function(d){if(rnd()<.45)d.num++});s.wait=Math.max(0,s.wait+(rnd()<.5?-1:1)*(rnd()<.6?1:0))});
    render();
  }
  cd.textContent=left+'秒後自動更新';
}

/* sort by location, same rules as the other LINE pages (shared saved position, refusal remembered) */
function distance(p,s){var r=Math.PI/180,a=p.lat*r,b=s.lat*r,dl=(s.lat-p.lat)*r,dg=(s.lng-p.lng)*r;var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a)*Math.cos(b)*Math.sin(dg/2)*Math.sin(dg/2);return 2*6371*Math.asin(Math.min(1,Math.sqrt(h)))}
var here=null;
function sortNear(){
  if(!here){state.forEach(function(s){s.km=null});state.sort(function(a,b){return a.index-b.index});return}
  state.forEach(function(s){s.km=distance(here,s)});
  state.sort(function(a,b){return a.km-b.km||a.index-b.index});
}
function syncAsk(){near.hidden=!!here&&read(DENIED)!=='1'}
function got(pos){
  var p={lat:pos&&pos.coords&&pos.coords.latitude,lng:pos&&pos.coords&&pos.coords.longitude,at:Date.now()};
  if(!valid(p))return;
  here=p;save(LOC,JSON.stringify(p));save(DENIED,'0');sortNear();render();syncAsk();
}
function failed(err){if(err&&err.code===1)save(DENIED,'1');syncAsk()}
function locate(){
  if(!navigator.geolocation)return failed();
  try{navigator.geolocation.getCurrentPosition(got,failed,{enableHighAccuracy:false,maximumAge:0,timeout:10000})}catch(e){failed(e)}
}
try{var saved=JSON.parse(read(LOC)||'null');if(valid(saved))here=saved}catch(e){}
nearBtn.addEventListener('click',locate);

/* side menu */
var drawer=document.getElementById('drawer'),menuBtn=document.getElementById('menu-btn');
function openMenu(v){drawer.hidden=!v;menuBtn.setAttribute('aria-expanded',String(v))}
menuBtn.addEventListener('click',function(){openMenu(true)});
drawer.addEventListener('click',function(e){if(e.target===drawer)openMenu(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')openMenu(false)});

today();sortNear();render();syncAsk();
if(read(DENIED)!=='1')locate();
setInterval(tick,1000);
})();
</script>
