    const legend=el('div','legend');[['ready','10 劑以上'],['low','1–9 劑'],['empty','0＝缺貨'],['unknown','未回報'],['unavailable','不提供']].forEach(([kind,label])=>{const item=el('span',kind);item.append(el('i'),document.createTextNode(label));legend.append(item);});main.append(legend);
    const statusrow=el('div','status-row'),status=el('p','status'),refresh=button('重新整理','refresh',()=>refreshData());status.setAttribute('role','status');status.setAttribute('aria-live','polite');statusrow.append(status,refresh);main.append(statusrow);
    const grid=el('section','clinic-grid');grid.setAttribute('aria-label','各院區疫苗庫存');main.append(grid);
    const foot=el('footer','foot','庫存依各院區回報時間顯示，請先來電確認。');main.append(foot);page.append(main);root.append(page);
    function snapshotTime(){return state.data.generatedAt||state.data.latestUpdate||'時間未提供';}
    function updateStatus(){
      status.classList.toggle('error',state.error);
      status.textContent=state.error?'暫時無法更新，保留上次資料；請先來電確認。':state.source==='seed'?'公開資料快照 '+snapshotTime()+(state.busy?'，更新中…':''):state.source==='saved'?'顯示上次資料'+(state.busy?'，更新中…':''):'已連線更新'+(state.busy?'，重新確認中…':'');
      refresh.disabled=state.busy;refresh.setAttribute('aria-busy',String(state.busy));
    }
    function render(){
      filters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.region===region)));
      locate.textContent=locating?'定位中…':position?'更新位置':'依位置排序';locate.disabled=locating;
      const cards=model.ordered(state.data,region,position).map(c=>{
        const card=el('article','clinic-card');card.style.setProperty('--clinic-bg',c.background);card.style.setProperty('--clinic-line',c.border);
        const head=el('div','clinic-heading'),title=el('h2','',c.name),phone=el('a','phone');phone.href=c.tel;phone.setAttribute('aria-label','撥打'+c.name);phone.append(icon('phone'));head.append(title,phone);card.append(head);
        const labels=[['自費','GSK 伏適流'],['自費','東洋輔流威護'],['公費','不分廠牌']];
        c.qty.forEach((q,i)=>{const row=el('div','stock-row'),label=el('div','vaccine-label'),tag=el('span','tag'+(i===2?' public':''),labels[i][0]);label.append(tag,el('span','vaccine-name',labels[i][1]));const info=model.quantity(q),count=el('span','quantity '+info.kind,info.text);count.setAttribute('aria-label',info.label);if(typeof q==='number')count.append(el('small','','劑'));row.append(label,count);card.append(row);});
        const meta=el('div','clinic-meta'),when=el('time','updated',c.updatedAt?'更新 '+c.updatedAt.slice(5):'尚未提供更新時間');if(c.updatedAt)when.dateTime=c.updatedAt.replace(' ','T')+':00+08:00';when.title=c.updatedAt||'尚未提供更新時間';meta.append(when);
        const nav=el('a','map');nav.href=c.map;nav.target='_blank';nav.rel='noopener noreferrer';nav.setAttribute('aria-label','導航至'+c.name+'，'+c.address);nav.append(icon('map'),document.createTextNode(c.km==null?'導航':(c.km<10?c.km.toFixed(1):Math.round(c.km))+' 公里'));meta.append(nav);card.append(meta);return card;
      });grid.replaceChildren(...cards);updateStatus();
    }
    async function refreshData(){
      if(state.busy)return;state={...state,busy:true};updateStatus();
      try{const raw=await requestVaccineStock(config.endpoint);state=model.settle(state,raw);if(!state.error){try{localStorage.setItem(storageKey,JSON.stringify({data:state.data}));}catch(e){}}}
      catch(e){state=model.settle(state,null,e);}render();
    }
    function findLocation(){
      if(locating)return;if(!navigator.geolocation){geo.textContent='此瀏覽器無法定位，可用地區篩選。';return;}
      locating=true;geo.textContent='正在取得位置…';render();navigator.geolocation.getCurrentPosition(p=>{position=[p.coords.latitude,p.coords.longitude];locating=false;try{localStorage.setItem(locationKey,JSON.stringify(position));}catch(e){}geo.textContent='已依距離由近到遠排序';render();},()=>{locating=false;geo.textContent=position?'無法更新位置，保留上次排序。可再點更新位置。':'未取得位置，可再試一次或使用地區篩選。';render();},{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
    }
    let interval=0;function startRefreshing(){if(!interval)interval=setInterval(()=>{if(!document.hidden)refreshData();},60000);}
    render();refreshData();startRefreshing();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshData();});window.addEventListener('pagehide',()=>{clearInterval(interval);interval=0;});window.addEventListener('pageshow',e=>{if(e.persisted){startRefreshing();refreshData();}});
    if(config.liffId&&config.liffId!=='LIFF_ID'){
      const sdk=document.createElement('script');sdk.src='https://static.line-scdn.net/liff/edge/2/sdk.js';sdk.async=true;sdk.onload=()=>{if(window.liff)window.liff.init({liffId:config.liffId,withLoginOnExternalBrowser:false}).catch(()=>{});};document.head.append(sdk);
    }
    return {refresh:refreshData,getState:()=>state,root};
  }
  if(typeof module!=='undefined'&&module.exports)module.exports={createVaccineModel,requestVaccineStock,mountVaccinePage};
  if(typeof window!=='undefined'&&window.LINE_VACCINE_CONFIG)mountVaccinePage(window.LINE_VACCINE_CONFIG);
})();

</script>
