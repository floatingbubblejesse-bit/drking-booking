    if(options.ready)Promise.resolve(options.ready).catch(()=>{}).then(()=>{ready=true;refresh(true);});
    return {refresh,stop,getPosition:()=>position};
  }
  function mountVaccinePage(config){
    const host=document.getElementById('line-vaccine-app');if(!host||host.shadowRoot)return;
    document.body.append(host);document.title='疫苗一覽';
    const root=host.attachShadow({mode:'open'}),model=createVaccineModel(config),style=document.createElement('style');style.textContent=config.css;root.append(style);
    const storageKey='line_vaccine_public_v1',locationKey='line_vaccine_location_v1';
    let state=model.initial(config.seed,'seed'),position=null;
    try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved?.data)state=model.initial(saved.data,'saved');}catch(e){}
    try{const saved=JSON.parse(localStorage.getItem(locationKey));if(Array.isArray(saved)&&saved.length===2&&saved.every(Number.isFinite)&&Math.abs(saved[0])<=90&&Math.abs(saved[1])<=180)position=saved;}catch(e){}

    function button(text,cls,action){const b=el('button',cls,text);b.type='button';b.addEventListener('click',action);return b;}
    function icon(kind){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',kind==='refresh'?'M20 7V3l-2.2 2.2A8 8 0 1 0 20 16h-2.2A6 6 0 1 1 16.4 6.6L14 9h6z':kind==='phone'?'M6.7 10.8a15.2 15.2 0 0 0 6.5 6.5l2.2-2.2a1 1 0 0 1 1-.2c1.1.4 2.3.6 3.6.6a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.5a1 1 0 0 1-.2 1z':'M21 3 3 10l7 3 3 8z');s.append(p);return s;}
    const page=el('div','vaccine-page'),brand=el('header','brand'),lockup=el('div','brand-lockup');lockup.setAttribute('role','img');lockup.setAttribute('aria-label','金鶯診所');
    const mark=el('span','brand-mark'),logo=el('img');logo.src=config.logo;logo.alt='';mark.append(logo);lockup.append(mark);
    const word=el('span','brand-name');[-88.8,-131.52,-173.76,-216].forEach(left=>{const crop=el('span','brand-glyph'),img=el('img');img.src=config.logo;img.alt='';img.style.left=left+'px';crop.append(img);word.append(crop);});lockup.append(word);brand.append(lockup);page.append(brand);
    const main=el('main'),status=el('p','status visually-hidden');status.setAttribute('role','status');status.setAttribute('aria-live','polite');
    const refresh=button('','refresh',()=>{refreshData();locationControl.refresh();});refresh.setAttribute('aria-label','重新整理疫苗庫存');refresh.title='重新整理';refresh.append(icon('refresh'));brand.append(refresh);
    const grid=el('section','clinic-grid');grid.setAttribute('aria-label','各院區疫苗庫存');main.append(grid);
    const foot=el('footer','foot','庫存依各院區回報時間顯示，請先來電確認。');main.append(foot,status);page.append(main);root.append(page);
    const liffReady=initializeVaccineLiff(config.liffId,window);
    const locationControl=createVaccineLocation({navigator,document,ready:liffReady,storage:{getItem:key=>localStorage.getItem(key),setItem:(key,value)=>localStorage.setItem(key,value)},position,onPosition:coords=>{
      const before=model.ordered(state.data,'',position).map(c=>c.name).join('|');position=coords;host.dataset.locationState='located';
      const after=model.ordered(state.data,'',position).map(c=>c.name).join('|');if(before!==after)render();
    }});
    host.dataset.locationState=position?'remembered':'pending';
    function snapshotTime(){return state.data.generatedAt||state.data.latestUpdate||'時間未提供';}
    function updateStatus(){
      status.classList.toggle('error',state.error);foot.textContent=state.error?'暫時無法更新，保留上次資料；請先來電確認。':'庫存依各院區回報時間顯示，請先來電確認。';
      status.textContent=state.error?'暫時無法更新，保留上次資料；請先來電確認。':state.source==='seed'?'公開資料快照 '+snapshotTime()+(state.busy?'，更新中…':''):state.source==='saved'?'顯示上次資料'+(state.busy?'，更新中…':''):'已連線更新'+(state.busy?'，重新確認中…':'');
      refresh.disabled=state.busy;refresh.setAttribute('aria-busy',String(state.busy));
    }
    function render(){
      const cards=model.ordered(state.data,'',position).map(c=>{
        const card=el('article','clinic-card');card.dataset.clinic=c.name;card.style.setProperty('--clinic-bg',c.background);card.style.setProperty('--clinic-line',c.border);
        const head=el('div','clinic-heading'),title=el('h2','',c.name),phone=el('a','phone');phone.href=c.tel;phone.setAttribute('aria-label','撥打'+c.name);phone.append(icon('phone'));head.append(title,phone);card.append(head);
        const labels=[['自費','GSK 伏適流'],['自費','東洋輔流威護'],['公費','不分廠牌']];
        c.qty.forEach((q,i)=>{const row=el('div','stock-row'),label=el('div','vaccine-label'),tag=el('span','tag'+(i===2?' public':''),labels[i][0]);label.append(tag,el('span','vaccine-name',labels[i][1]));const info=model.quantity(q),count=el('span','quantity '+info.kind,info.text);count.setAttribute('aria-label',info.label);if(typeof q==='number')count.append(el('small','','劑'));row.append(label,count);card.append(row);});
        const meta=el('div','clinic-meta'),when=el('time','updated',c.updatedAt?'更新 '+c.updatedAt.slice(5):'尚未提供更新時間');if(c.updatedAt)when.dateTime=c.updatedAt.replace(' ','T')+':00+08:00';when.title=c.updatedAt||'尚未提供更新時間';meta.append(when);
        const nav=el('a','map');nav.href=c.map;nav.target='_blank';nav.rel='noopener noreferrer';nav.setAttribute('aria-label','導航至'+c.name+'，'+c.address);nav.title='導航至'+c.name;nav.append(icon('map'));meta.append(nav);card.append(meta);return card;

    }
    async function refreshData(){
      if(state.busy)return;state={...state,busy:true};updateStatus();
      try{const raw=await requestVaccineStock(config.endpoint);state=model.settle(state,raw);if(!state.error){try{localStorage.setItem(storageKey,JSON.stringify({data:state.data}));}catch(e){}}}
      catch(e){state=model.settle(state,null,e);}render();
    }
    let interval=0;function startRefreshing(){if(!interval)interval=setInterval(()=>{if(!document.hidden){refreshData();locationControl.refresh();}},60000);}
    render();refreshData();locationControl.refresh(true);startRefreshing();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshData();locationControl.refresh();}else locationControl.stop();});
    window.addEventListener('pagehide',()=>{clearInterval(interval);interval=0;locationControl.stop();});
    window.addEventListener('pageshow',e=>{if(e.persisted){startRefreshing();refreshData();locationControl.refresh();}});
    return {refresh:refreshData,getState:()=>state,root};
  }
  if(typeof module!=='undefined'&&module.exports)module.exports={createVaccineModel,requestVaccineStock,initializeVaccineLiff,createVaccineLocation,mountVaccinePage};
  if(typeof window!=='undefined'&&window.LINE_VACCINE_CONFIG)mountVaccinePage(window.LINE_VACCINE_CONFIG);
})();
