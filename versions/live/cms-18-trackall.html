<script id="qClinicHoursAlignmentScript20261025">
(function(){
  if(window.__qClinicHoursAligned)return;
  window.__qClinicHoursAligned=true;
  var queued=false;
  function cell(text,className){
    var el=document.createElement("span");
    el.className=className;
    el.textContent=text;
    return el;
  }
  function align(){
    queued=false;
    document.querySelectorAll("#ci>p>span:not([data-q-hours-aligned])").forEach(function(el){
      var parts=el.textContent.trim().split(/[、，,]/).map(function(s){return s.trim();});
      var breaks=parts.every(function(s){return /^(上午|中午|下午|晚上)[ 　]*[0-9]{1,2}:[0-9]{2}/.test(s);});
      var rows=parts.map(function(s){return s.match(/^(?:(上午|中午|下午|晚上)[ 　]*)?([0-9]{1,2}:[0-9]{2})[ 　]*([～~〜–－-])[ 　]*([0-9]{1,2}:[0-9]{2})[ 　]*(休診)?$/);});
      if(!rows.length||rows.some(function(r){return !r;})||(!breaks&&rows.some(function(r){return r[1]||r[5];})))return;
      var fragment=document.createDocumentFragment();
      rows.forEach(function(r){
        if(breaks)fragment.appendChild(cell(r[1],"qhours-label"));
        fragment.appendChild(cell(r[2],"qhours-start"));
        fragment.appendChild(cell(r[3],"qhours-separator"));
        fragment.appendChild(cell(r[4],"qhours-end"));
        if(breaks)fragment.appendChild(cell(r[5]||"","qhours-note"));
      });
      el.dataset.qHoursAligned="1";
      el.classList.add("qhours-grid");
      if(breaks)el.classList.add("qhours-breaks");
      el.parentElement.classList.add("qhours-row");
      el.replaceChildren(fragment);
    });
  }
  function queue(){if(!queued){queued=true;requestAnimationFrame(align);}}
  function boot(){
    align();
    new MutationObserver(function(records){
      if(records.some(function(r){
        if(r.target.nodeType===1&&r.target.closest("#ci"))return true;
        return Array.from(r.addedNodes).some(function(n){return n.nodeType===1&&(n.id==="ci"||n.querySelector("#ci"));});
      }))queue();
    }).observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

    '<select class="tb_lim" aria-label="顯示院區數"><option value="0">全部院區</option><option value="4">附近 4 院</option><option value="6">附近 6 院</option><option value="8">附近 8 院</option></select>' +
    '</div><div class="tb_st"><span class="tb_s1"></span><span class="tb_s2"></span></div><div class="tb_grid"></div></div>';
  var grid = root.querySelector('.tb_grid'), locBtn = root.querySelector('.tb_loc'), limSel = root.querySelector('.tb_lim');

  }
  function upText(a){

  }
  function render(){
    var all = sorted(), a = (limit && pos) ? all.slice(0, limit) : all;

    root.querySelector('.tb_s1').textContent = upText(all);
    root.querySelector('.tb_s2').textContent = geoMsg || (pos ? '由近至遠・直線距離' : '點卡片可放大');
    root.style.setProperty('--z', ZS[zi]);
    if (openName) renderFs(all);
  }
  function bottomInset(){
    try {
      var els = document.elementsFromPoint(window.innerWidth / 2, window.innerHeight - 3);
      for (var i = 0; i < els.length; i++) {
        var e = els[i]; if (root.contains(e) || e === document.documentElement || e === document.body) continue;
        var p = e; while (p && p !== document.body) { if (getComputedStyle(p).position === 'fixed') { var rr = p.getBoundingClientRect(); if (rr.height < window.innerHeight * 0.3 && rr.width > window.innerWidth * 0.5) return Math.max(0, window.innerHeight - rr.top); break; } p = p.parentElement; }
      }
    } catch (e) {}
    return 0;
  }
  function imp(el, o, on){ if (!el) return; for (var k in o) { if (on) el.style.setProperty(k, o[k], 'important'); else el.style.removeProperty(k); } }
  function mobileHead(){
    var hb = document.getElementById('left-panel-link'), on = false;
    try { on = !!hb && getComputedStyle(hb).display !== 'none' && hb.getBoundingClientRect().width > 0; } catch (e) {}
    var de = document.documentElement, was = de.classList.contains('ec_tb_mh');

    imp(t.querySelector('.logo'), {'height': '56px', 'padding': '10px 0', 'text-align': 'center'}, on);
    imp(t.querySelector('.logo > a:not(#dkClassicBrand)'), {'display': 'inline'}, on);
    imp(q, {'display': 'inline-flex'}, on);
    imp(t.querySelector('img.logosite'), q ? {'display': 'none'} : {'display': 'inline-block', 'visibility': 'visible', 'height': '36px', 'width': 'auto'}, on);
    imp(hb, {'color': '#000', 'top': '28px'}, on);
    imp(document.getElementById('dkClassicSearch'), {'display': 'none'}, on);
  }
  function topInset(){
    try {
      if (document.documentElement.classList.contains('ec_tb_mh')) { var th = document.querySelector('.top'); if (th) return Math.max(0, th.getBoundingClientRect().bottom); }
      var els = document.elementsFromPoint(window.innerWidth / 2, 3);
      for (var i = 0; i < els.length; i++) {
        var e = els[i]; if (root.contains(e) || e === document.documentElement || e === document.body) continue;
        var p = e; while (p && p !== document.body) { if (getComputedStyle(p).position === 'fixed') { var rr = p.getBoundingClientRect(); if (rr.height < window.innerHeight * 0.4 && rr.width > window.innerWidth * 0.5) { var bot = rr.bottom, ks = p.querySelectorAll('*'); for (var k = 0; k < ks.length && k < 300; k++) { var kr = ks[k].getBoundingClientRect(); if (kr.width > 0 && kr.height > 0 && kr.top < bot + 1 && kr.bottom < window.innerHeight * 0.4 && kr.bottom > bot) bot = kr.bottom; } return Math.max(0, bot); } break; } p = p.parentElement; }
      }
    } catch (e) {}
    return 0;
  }
  /* 工具列若被其他固定元素（頁首等）蓋住，回傳遮蓋物的下緣 */
  function coverBottom(br){
    var best = 0, xs = [24, window.innerWidth / 2, window.innerWidth - 24];
    try {
      for (var i = 0; i < xs.length; i++) {
        var e = document.elementFromPoint(xs[i], br.top + 6);
        if (!e || root.contains(e)) continue;
        var p = e, hit = null;
        while (p && p !== document.body && p !== document.documentElement) { var ps = getComputedStyle(p).position; if (ps === 'fixed' || ps === 'sticky') hit = p; p = p.parentElement; }
        var cands = hit ? [e, hit] : [e];
        for (var k = 0; k < cands.length; k++) { var rr = cands[k].getBoundingClientRect(); if (rr.height < window.innerHeight * 0.4 && rr.bottom > best) best = rr.bottom; }
      }
    } catch (x) {}
    return best;
  }
  function layout(){
    mobileHead();
    var w = document.documentElement.clientWidth, h = window.innerHeight;
    root.style.left = '0px'; root.style.width = '';
    var r = root.getBoundingClientRect();
    root.style.left = (-r.left) + 'px'; root.style.width = w + 'px';
    var cols = (w >= 900 && w > h) ? PER_SCREEN : 2, rowsN = Math.max(1, Math.round(PER_SCREEN / cols));

    var sy = window.pageYOffset || 0;
    root.style.paddingTop = Math.max(8, topInset() - (r.top + sy) + 8) + 'px';
    if (sy < 3 && !openName) {
      var bar = root.querySelector('.tb_bar');
      for (var gi = 0; gi < 3; gi++) {
        var br = bar.getBoundingClientRect(), cv = coverBottom(br);
        if (cv <= br.top + 1) break;
        root.style.paddingTop = (parseFloat(root.style.paddingTop) + (cv - br.top) + 8) + 'px';
      }
    }
    var avail = h - (grid.getBoundingClientRect().top + sy) - bottomInset() - 8;
    var ch = Math.floor((avail - (rowsN - 1) * 10) / rowsN);
    var minH = cw * 0.92;
    root.style.setProperty('--cols', cols);
    root.style.setProperty('--ch', Math.max(Math.min(ch, cols === 2 ? cw * 1.6 : cw * 1.3), minH) + 'px');
    root.style.setProperty('--u', (Math.min(cw, 430) / 100) + 'px');
  }

  /* ===== 全螢幕單院 ===== */
  var fs = null;
  function renderFs(all){
    var c = null, i; for (i = 0; i < all.length; i++) if (all[i].name === openName) { c = all[i]; break; }
    if (!c) return;
    var n = num(c), multi = c.docs.length > 1, info = C[c.name], h = '';
    h += '<div class="fs_top"><button type="button" class="fs_x" data-a="close" aria-label="返回全部院區">✕<i> 返回</i></button>' +
      '<div class="fs_t"><b>' + esc(c.name) + '</b><span>' + (c.near ? '<span class="tb_near">最近</span>' : '') + esc(c.d != null ? '距離約 ' + fmtD(c.d) : '') + '</span></div>' +
      '<div class="fs_pn"><button type="button" data-a="prev" aria-label="上一個院區">‹</button><button type="button" data-a="next" aria-label="下一個院區">›</button></div></div>';
    h += '<div class="fs_body"><div class="fs_nums"><div><i>' + (multi ? '院區診號' : '看診號碼') + '</i><strong>' + esc(n || '—') + '</strong></div><div class="tb_w"><i>候診人數</i><strong>' + esc(c.docs.length && c.wait !== '' ? c.wait : '—') + '</strong><small>人</small></div></div>';
    if (c.docs.length) { h += '<div class="fs_docs">'; for (i = 0; i < c.docs.length; i++) h += '<div class="fs_doc">' + (c.docs[i].room ? '<u>' + esc(c.docs[i].room) + '</u>' : '') + '<span>' + esc(c.docs[i].name) + ' 醫師</span>' + (c.docs[i].num ? '<em>' + esc(c.docs[i].num) + ' 號</em>' : '') + '</div>'; h += '</div>'; }
    else h += '<div class="fs_note">' + esc(c.note || '目前無門診') + '</div>';
    if (c.memo) h += '<div class="fs_memo">' + esc(c.memo) + '</div>';
    if (c.up) h += '<div class="fs_up">更新時間 ' + esc(c.up.replace(/^¦d{4}-/, '').replace(/:¦d¦d$/, '')) + '｜自動更新中</div>';
    h += '</div>';
    if (h !== lastFs) { var sy = fs.scrollTop; fs.firstChild.innerHTML = h; fs.scrollTop = sy; lastFs = h; }
    fs.style.setProperty('--z', ZS[zi]);
  }
  function known(name){ for (var i = 0; i < list.length; i++) if (list[i].name === name) return true; return false; }
  function openFs(name, push){
    if (!known(name)) return;
    if (!fs) {
      fs = document.createElement('div'); fs.id = 'ec_tb_fs'; fs.setAttribute('role', 'dialog'); fs.setAttribute('aria-modal', 'true');
      fs.innerHTML = '<div class="fs_dyn"></div><div class="fs_vid"></div>';
      fs.addEventListener('click', function(e){
        var b = e.target.closest ? e.target.closest('[data-a]') : null; if (!b) return;
        var a = b.getAttribute('data-a');
        if (a === 'close') { if (history.state && history.state.ecTb && history.state.pushed) history.back(); else closeFs(true); }
        else if (a === 'prev' || a === 'next') step(a === 'next' ? 1 : -1);
        else if (a === 'sch') openSch();
      });
    }
    var wasPushed = !!(history.state && history.state.ecTb && history.state.pushed);
    openName = name; lastFs = '';
    if (!fs.parentNode) {
      fs.lastChild.innerHTML = VID ? '<iframe src="https://www.youtube.com/embed/videoseries?list=' + VID + '&autoplay=1&mute=1&playsinline=1&loop=1&rel=0" title="擇木良食影片" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>' : '';
      document.body.appendChild(fs);
    }
    document.documentElement.classList.add('ec_tb_lock');
    try {
      if (push) history.pushState({ecTb: name, pushed: true}, '', '#ec-' + encodeURIComponent(name));
      else history.replaceState({ecTb: name, pushed: wasPushed}, '', '#ec-' + encodeURIComponent(name));
    } catch (e) {}
    fs.scrollTop = 0; renderFs(sorted());
  }
  function closeFs(fixUrl){
    openName = ''; closeSch();
    if (fs && fs.parentNode) fs.parentNode.removeChild(fs);
    document.documentElement.classList.remove('ec_tb_lock');
    if (fixUrl) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  }
  function step(d){
    var a = sorted(), i, k = -1; for (i = 0; i < a.length; i++) if (a[i].name === openName) k = i;
    if (k < 0 || !a.length) return;

  }
  function openSch(){
    var c = null; for (var i = 0; i < list.length; i++) if (list[i].name === openName) c = list[i];

  });

    if (!openName) return;
    if (e.key === 'Escape') { if (document.getElementById('ec_tb_sch')) closeSch(); else if (history.state && history.state.ecTb && history.state.pushed) history.back(); else closeFs(true); }

  /* ===== 操作 ===== */
  grid.addEventListener('click', function(e){ var c = e.target.closest ? e.target.closest('.tb_card') : null; if (c) openFs(c.getAttribute('data-n'), true); });
  grid.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tb_card')) { e.preventDefault(); openFs(e.target.getAttribute('data-n'), true); } });

  limSel.addEventListener('change', function(){ limit = +limSel.value || 0; if (limit && !pos) locate(false); else render(); });

  function locate(auto){

  }

  /* ===== 啟動 ===== */
  var src = null, timer = 0;
  function refresh(){

    return l.length;
  }
  function selfFetch(){
    var x = new XMLHttpRequest(); x.open('POST', '/gettrack.html');
    x.onload = function(){ if (x.status === 200) { var d = document.createElement('div'); d.innerHTML = x.responseText; var l = parse(d); if (l.length) { list = l; render(); layout(); } } };
    x.send();
  }
  function start(){
    src = document.getElementById('showtrack');
    var ban = document.querySelector('#indcon2 > .bannercon');

  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
