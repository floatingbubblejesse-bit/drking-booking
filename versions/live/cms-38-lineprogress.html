    if(window.__qDoctorCardSourceRestored)return;
    if(typeof window.qf7!==`function`||typeof window.qf5!==`function`){if(++installAttempts<100)setTimeout(install,100);return;}
    window.__qDoctorCardSourceRestored=true;
    document.documentElement.dataset.qDoctorNavigation=`immediate-v2`;
    var original=window.qf7;
    var clinics=`鶯歌 三樹 樹林 桃園 土城 八德 龍潭 大溪 大竹 大湳 平鎮 埔心 觀音 龍岡`.split(` `);
    window.qf7=function(clinic){
      var category=clinics.indexOf(clinic.replace(`院區`,``))+2;
      return original(clinic).then(function(profiles){
        return profiles.map(function(profile){
          if(category<2||!profile.href)return profile;
          var url=new URL(profile.href,location.href);
          var match=url.pathname.match(/product-([0-9]+)[.]html$/);
          if(!match||url.origin!==location.origin)return profile;
          var restored=Object.assign({},profile);
          url.pathname=url.pathname.replace(match[0],`product-`+match[1]+`-`+category+`.html`);
          restored.href=url.pathname+url.search+url.hash;
          return restored;
        });
      });
    };
    var request=0,activeButton=null;
    function doctorName(value){
      return String(value||``).replace(/[ 　]/g,``).replace(/(總院長|副院長|院長|醫師|主任|執行長)$/g,``).trim();
    }
    document.addEventListener(`click`,function(event){
      var button=event.target.closest(`.qdlx,.dp-menu button`);
      if(!button||!document.body.classList.contains(`qD`))return;
      var clinic;
      try{clinic=decodeURIComponent(location.hash.slice(4));}catch(error){return;}
      if(!clinic||location.hash.indexOf(`#ec-`)!==0)return;
      event.preventDefault();event.stopImmediatePropagation();
      var name=doctorName(button.dataset.name||button.textContent);
      var route=location.hash,token=++request,started=Date.now();
      if(activeButton)activeButton.removeAttribute(`aria-busy`);
      activeButton=button;button.setAttribute(`aria-busy`,`true`);
      if(event.detail>0)button.blur();
      var oldStatus=document.getElementById(`qDoctorJumpStatus`);
      if(oldStatus)oldStatus.remove();
      window.qf5(clinic);
      function finish(){button.removeAttribute(`aria-busy`);if(activeButton===button)activeButton=null;}
      function jump(){
        if(token!==request||location.hash!==route||!document.body.classList.contains(`qD`)){finish();return;}
        var panel=document.getElementById(`dp`);
        var cards=panel&&panel.dataset.clinic===clinic?Array.from(panel.querySelectorAll(`.dp-card`)):[];
        var card=cards.find(function(item){return doctorName(item.dataset.name)===name;});
        var expired=Date.now()-started>=8000;
        if(card){
          panel.querySelectorAll(`.dp-menu button`).forEach(function(item){item.setAttribute(`aria-pressed`,String(doctorName(item.dataset.name)===name));});
          var bio=card.querySelector(`.dp-bio`);
          if(bio){bio.classList.remove(`dp-expanded`);bio.setAttribute(`aria-expanded`,`false`);var more=bio.querySelector(`.dp-more`);if(more)more.textContent=`… 展開`;}
          scrollToCard(card);
          finish();
          return;
        }
        if(expired){
          if(panel){var status=document.createElement(`p`);status.id=`qDoctorJumpStatus`;status.setAttribute(`role`,`status`);status.textContent=`醫師卡片暫時無法載入，請稍後再試`;panel.prepend(status);scrollToCard(status);}
          finish();return;
        }
        setTimeout(jump,60);
      }
      jump();
    },true);
  }
  if(document.readyState===`loading`)document.addEventListener(`DOMContentLoaded`,install);else install();
})();
</script>

<script id="dkRowMemo20261105js">
/* 20261105: when nobody is waiting, the clinic note (for example 14:00開始) replaces the doctor, in each clinic row and on the single clinic view, same as the official progress page. The doctor names are kept and put back when the note goes. The notes come from the same progress data, read every 10 seconds. To undo, delete this script and the dkRowMemo20261105 style above. */
(function(){if(window.__dkRowMemo)return;window.__dkRowMemo=1;
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
var memoItems=null;
function memoFetch(){if(document.hidden)return;var x=new XMLHttpRequest();try{x.open("GET","/common-gettrackdata.html?_="+Date.now(),true);x.setRequestHeader("X-Requested-With","XMLHttpRequest");x.onload=function(){try{var d=JSON.parse(x.responseText);if(d&&d.items){memoItems=d.items;rowSoon()}}catch(e){}};x.send()}catch(e){}}
function memoFor(card){var id=card.getAttribute("data-hospid"),d=memoItems&&id?memoItems[id]:null,memo="",wait=0;if(d){memo=String(d.memo||"").trim();wait=Number(d.sum)}else{var mt=card.querySelector(".memo_text"),wn=card.querySelector(".wait_num");memo=mt?mt.textContent.trim():"";wait=wn?Number(wn.textContent.trim()):0}return wait>0?"":memo}
function memoSingle(card,memo){card.querySelectorAll(".qdd .qdr").forEach(function(r){var g=r.querySelector(".dn-group");if(g){var m=g.querySelector(".dkq-memo-n");if(memo){if(!m){m=el("span","dkq-memo-n");g.appendChild(m)}if(m.textContent!==memo)m.textContent=memo;if(!g.classList.contains("dkq-on"))g.classList.add("dkq-on")}else if(m){m.remove();g.classList.remove("dkq-on")}}if(r.classList.contains("qdw")&&r.classList.contains("dkq-on")!==!!memo)r.classList.toggle("dkq-on",!!memo)})}
var rowQ=false;function rowMemo(){rowQ=false;var list=document.getElementById("ql");document.querySelectorAll("#showtrack .elite_number>ul>li").forEach(function(card){var memo=memoFor(card);memoSingle(card,memo);if(!list)return;var nm=card.querySelector(".elite_name");if(!nm||!nm.firstChild)return;var name=nm.firstChild.textContent.trim().replace("院區","");var row=null;for(var i=0;i<list.children.length;i++){var x=list.children[i].querySelector(".qnm");if(x&&x.textContent===name){row=list.children[i];break}}if(!row)return;var ds=row.querySelector(".qds"),dn=row.querySelector(".qdns");if(!ds||!dn)return;if(row.classList.contains("qlive"))memo="";var has=dn.querySelector(".dkq-memo-t");if(memo){if(has&&has.textContent===memo)return;if(!has)ds.dkSaved=Array.prototype.slice.call(dn.childNodes);dn.textContent="";dn.appendChild(el("span","qd-name dkq-memo-t",memo));ds.classList.add("dkq-memo")}else if(has){dn.textContent="";(ds.dkSaved||[]).forEach(function(n){dn.appendChild(n)});ds.dkSaved=null;ds.classList.remove("dkq-memo")}})}
function rowSoon(){if(!rowQ){rowQ=true;requestAnimationFrame(rowMemo)}}
function boot(){try{new MutationObserver(rowSoon).observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}rowSoon()}
memoFetch();setInterval(memoFetch,10000);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
